[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolregistry-server"
dynamic = ["version"]
description = "ToolRegistry Server: Serve Custom Tools via OpenAPI and MCP for Function-Calling LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Oaklight", email = "pding.sam@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = [
    "llm",
    "tool-calling",
    "function-calling",
    "ai-agents",
    "mcp",
    "mcp-server",
    "openapi",
    "fastapi",
    "agentic-ai",
    "toolregistry",
]
# TODO(release): raise this floor to the toolregistry release carrying
# Tool.declared_execution_hints (#353) before the next server release. Until
# then the declared-hints default falls back to the resolved mapping and
# tag-derived hints still reach clients.
dependencies = ["toolregistry>=0.19.0,<1.0.0"]

[project.optional-dependencies]
openapi = ["fastapi>=0.119.0", "uvicorn[standard]>=0.24.0"]
# Floor raised from 1.17.0: mcp < 1.22 imports a pydantic internal that
# pydantic 2.12+ removed, so those versions fail at import with a current
# pydantic (see #95).
mcp = ["mcp>=1.22.0,<3"]
all = ["toolregistry-server[openapi]", "toolregistry-server[mcp]"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff==0.15.20",
    "ty==0.0.54",
    "complexipy==5.6.1",
    "build>=1.2.0",
    "twine>=6.1.0",
]

[project.scripts]
toolregistry-server = "toolregistry_server.cli:main"

[project.urls]
Documentation = "https://toolregistry-server.readthedocs.io"
Repository = "https://github.com/Oaklight/toolregistry-server"
Issues = "https://github.com/Oaklight/toolregistry-server/issues"
Changelog = "https://github.com/Oaklight/toolregistry-server/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "toolregistry_server.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"toolregistry_server" = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["src/toolregistry_server/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "src/toolregistry_server/_vendor",
    "src/toolregistry_server/adapters/mcp/_compat.py",
]

[tool.ty.rules]
unresolved-import = "ignore"
unused-ignore-comment = "ignore"

[tool.complexipy]
exclude = ["src/toolregistry_server/_vendor"]
max-complexity-allowed = 20

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.zerodep]
vendor-dir = "src/toolregistry_server/_vendor"

