[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolregistry-server"
dynamic = ["version"]
description = "ToolRegistry Server: Serve Custom Tools via OpenAPI and MCP for Function-Calling LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Oaklight", email = "pding.sam@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = [
    "llm",
    "tool-calling",
    "function-calling",
    "ai-agents",
    "mcp",
    "mcp-server",
    "openapi",
    "fastapi",
    "agentic-ai",
    "toolregistry",
]
# Core 0.20.1 is the floor: it has the explicit local-file opt-in (#376), the
# non-finite float/Decimal projection in ToolResultJSONEncoder (#135), the
# netpolicy special-purpose range fix (#425) and the discovery re-entrancy fix
# (#428), so this server carries no compatibility probes and does not support
# 0.20.0.
dependencies = ["toolregistry>=0.20.1,<1.0.0"]

[project.optional-dependencies]
# The standalone ``openapi`` command runs on the vendored httpserver, so the
# extra stays small.  OAuth verification needs PyJWT and a crypto backend; the
# base install remains dependency-free, and a deployment that enables OAuth
# on this command installs the extra.
openapi = ["pyjwt[crypto]>=2.10"]
# FastAPI and uvicorn are needed only by the gateway's ASGI backend.  The
# httpserver gateway backend and the whole standalone OpenAPI server work
# without them.
gateway = [
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.24.0",
    # OAuth resource-server verification (RS256/ES256) needs PyJWT and a
    # crypto backend.  mcp already brings PyJWT transitively; naming it here
    # keeps a gateway-only install able to verify tokens.
    "pyjwt[crypto]>=2.10",
]
# Floor raised from 1.17.0: mcp < 1.22 imports a pydantic internal that
# pydantic 2.12+ removed, so those versions fail at import with a current
# pydantic (see #95).
mcp = ["mcp>=1.22.0,<3"]
# Bounded execution of spec-supplied regexes.  Without this extra the server
# does not execute spec patterns at all; with it, every match is bounded by a
# per-match timeout and a per-request budget.  Kept out of ``all`` so the
# default test matrix keeps covering the no-regex fallback.
regex = ["regex>=2024.4.16"]
all = ["toolregistry-server[gateway]", "toolregistry-server[mcp]"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff==0.15.20",
    "ty==0.0.54",
    "complexipy==5.6.1",
    "build>=1.2.0",
    "twine>=6.1.0",
]

[project.scripts]
toolregistry-server = "toolregistry_server.cli:main"

[project.urls]
Documentation = "https://toolregistry-server.readthedocs.io"
Repository = "https://github.com/Oaklight/toolregistry-server"
Issues = "https://github.com/Oaklight/toolregistry-server/issues"
Changelog = "https://github.com/Oaklight/toolregistry-server/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "toolregistry_server.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"toolregistry_server" = ["py.typed"]
"toolregistry_server.ext.gateway" = ["assets/*.js", "assets/*.css"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["src/toolregistry_server/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "src/toolregistry_server/_vendor",
    "src/toolregistry_server/adapters/mcp/_compat.py",
]

[tool.ty.rules]
unresolved-import = "ignore"
unused-ignore-comment = "ignore"

[tool.complexipy]
exclude = ["src/toolregistry_server/_vendor"]
max-complexity-allowed = 20

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.zerodep]
vendor-dir = "src/toolregistry_server/_vendor"

