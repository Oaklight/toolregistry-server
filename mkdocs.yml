site_name: ToolRegistry Server
site_description: Serve Custom Tools via OpenAPI and MCP for Function-Calling LLMs
site_author: Peng Ding
site_url: https://toolregistry-server.readthedocs.io/en/latest
repo_name: Oaklight/toolregistry-server
repo_url: https://github.com/Oaklight/toolregistry-server
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
    - media: "(prefers-color-scheme)"
      primary: green
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Home:
          - index.md
        Get Started:
          - get-started/installation.md
          - get-started/quickstart.md
        Guides:
          - guides/configuration.md
          - guides/authentication.md
          - guides/openapi.md
          - guides/mcp.md
          - guides/extending.md
        Examples:
          - examples/index.md
        Reference:
          - reference/cli/index.md
          - reference/adapters.md
          - reference/api/index.md
          - reference/api/core/route_table.md
          - reference/api/openapi.md
          - reference/api/mcp.md
          - reference/api/auth.md
        Ecosystem:
          - ecosystem.md
        Changelog:
          - changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/toolregistry-server.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/toolregistry-server
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/toolregistry-server/
  alternate:
    - name: English
      link: /en/latest/
      lang: en
    - name: 中文
      link: /zh-cn/latest/
      lang: zh

nav:
  - Home: index.md
  - Get Started:
      - Installation: get-started/installation.md
      - Quick Start: get-started/quickstart.md
  - Guides:
      - Configuration: guides/configuration.md
      - Authentication: guides/authentication.md
      - OpenAPI Adapter: guides/openapi.md
      - MCP Adapter: guides/mcp.md
      - Extending: guides/extending.md
  - Examples:
      - examples/index.md
  - Reference:
      - CLI: reference/cli/index.md
      - Protocol Adapters: reference/adapters.md
      - API Reference:
          - reference/api/index.md
          - RouteTable & RouteEntry: reference/api/core/route_table.md
          - OpenAPI Module: reference/api/openapi.md
          - MCP Module: reference/api/mcp.md
          - Auth Module: reference/api/auth.md
  - Ecosystem:
      - Overview: ecosystem.md
      - ToolRegistry: https://toolregistry.readthedocs.io/
      - Hub Tools: https://toolregistry-hub.readthedocs.io/
  - Changelog: changelog.md
