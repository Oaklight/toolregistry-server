site_name: ToolRegistry Server
site_description: 通过 OpenAPI 和 MCP 为函数调用 LLM 提供自定义工具服务
site_author: Peng Ding
site_url: https://toolregistry-server.readthedocs.io/zh-cn/latest
repo_name: Oaklight/toolregistry-server
repo_url: https://github.com/Oaklight/toolregistry-server
copyright: Copyright &copy; 2026 Peng Ding

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: 跟随系统偏好
    - media: "(prefers-color-scheme)"
      primary: green
      accent: green
      toggle:
        icon: material/brightness-auto
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - header.autohide
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        首页:
          - index.md
        快速上手:
          - get-started/installation.md
          - get-started/quickstart.md
        指南:
          - guides/configuration.md
          - guides/authentication.md
          - guides/openapi.md
          - guides/mcp.md
        示例:
          - examples/index.md
        参考:
          - reference/cli/index.md
          - reference/adapters.md
          - reference/api/index.md
          - reference/api/core/route_table.md
          - reference/api/openapi.md
          - reference/api/mcp.md
          - reference/api/auth.md
        生态系统:
          - ecosystem.md
        更新日志:
          - changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/toolregistry-server.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oaklight/toolregistry-server
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/toolregistry-server/
  alternate:
    - name: English
      link: /en/latest/
      lang: en
    - name: 中文
      link: /zh-cn/latest/
      lang: zh

nav:
  - 首页: index.md
  - 快速上手:
      - 安装: get-started/installation.md
      - 快速开始: get-started/quickstart.md
  - 指南:
      - 配置: guides/configuration.md
      - 认证: guides/authentication.md
      - OpenAPI 适配器: guides/openapi.md
      - MCP 适配器: guides/mcp.md
  - 示例:
      - examples/index.md
  - 参考:
      - 命令行工具: reference/cli/index.md
      - 协议适配器: reference/adapters.md
      - API 参考:
          - reference/api/index.md
          - RouteTable & RouteEntry: reference/api/core/route_table.md
          - OpenAPI 模块: reference/api/openapi.md
          - MCP 模块: reference/api/mcp.md
          - 认证模块: reference/api/auth.md
  - 生态系统:
      - 概览: ecosystem.md
      - ToolRegistry: https://toolregistry.readthedocs.io/
      - Hub 工具: https://toolregistry-hub.readthedocs.io/
  - 更新日志: changelog.md
