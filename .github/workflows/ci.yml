name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies for ty
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[all,dev]"

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[all,dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # The MCP adapter has two field-naming branches: camelCase on SDK v1 and
  # snake_case on v2. The normal matrix resolves the latest SDK, so whichever
  # branch is not current would ship untested. Pin one leg to v1.
  test-mcp-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies with MCP SDK v1
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          # Lowest v1 the package declares support for (#95): below 1.22 the
          # SDK imports a pydantic internal that current pydantic removed.
          pip install "mcp>=1.22,<2"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Run MCP adapter tests
        run: python -m pytest tests/test_mcp_adapter.py tests/test_mcp_session.py -q

  # Forward-compatibility canary: run the OpenAPI suites against core's
  # master branch, which is ahead of the released floor pinned in
  # pyproject.toml.  A failure here means an unreleased core change would
  # break this server, so it must be fixed or coordinated before that core
  # release lands.
  test-core-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies with core master
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[all,dev]"
          pip install --force-reinstall --no-deps "toolregistry @ git+https://github.com/Oaklight/ToolRegistry@master"
          python -c "import importlib.metadata as m; print('toolregistry', m.version('toolregistry'))"

      - name: Run OpenAPI differential tests
        run: python -m pytest tests/test_openapi_backend_parity.py tests/test_openapi_adapter.py -q

      # The gateway admin extension targets the extension contract that is on
      # core master ahead of the released floor; on the released core its
      # tests skip, so this job is where they actually execute.
      - name: Run gateway admin tests
        run: >
          python -m pytest
          tests/test_gateway_admin.py
          tests/test_gateway_admin_host.py
          -q

      # The runtime source manager's refresh tests feature-detect core
      # capabilities (forget_tracked_tools, base_url_changed) that are on
      # core master ahead of the released floor.  Run the suite here so a
      # moved base URL is exercised before the 0.21.0 floor bump (#205).
      - name: Run source manager tests
        run: python -m pytest tests/test_source_manager.py -q

  # The `regex` extra is optional and deliberately not part of `all`, so the
  # default matrix covers the "spec patterns are not executed" fallback. This
  # job installs it and re-runs the OpenAPI suites, because installing it
  # changes what validation enforces (and how `additionalProperties` behaves).
  test-regex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies with the regex extra
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ --prefer-binary -e ".[all,dev,regex]"
          python -c "import regex; print('regex', regex.__version__)"

      - name: Run OpenAPI and regex-guard tests
        run: |
          python -m pytest \
            tests/test_regex_guard.py \
            tests/test_openapi_regex_validation.py \
            tests/test_openapi_adapter.py \
            tests/test_openapi_backend_parity.py \
            tests/test_openapi_server_app.py -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
