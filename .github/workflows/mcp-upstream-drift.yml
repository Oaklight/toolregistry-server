name: MCP Upstream Drift

# Watches the two upstream dependencies the MCP adapter has no control over:
#
# - the MCP specification (modelcontextprotocol/modelcontextprotocol), whose
#   revision the adapter is written against (`MCP_SPEC_VERSION`);
# - the Python SDK (`mcp` on PyPI), including major versions outside the
#   range declared in pyproject.toml.
#
# Neither is exercised by the per-PR matrix once a release moves beyond the
# declared range, so check weekly and open one issue per drift, updating it
# while the drift persists.

on:
  schedule:
    - cron: "43 5 * * 1" # Mondays 05:43 UTC; off the hour to avoid the fleet
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sdk:
    name: Latest MCP SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project with the latest SDK
        id: sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          # Deliberately ignore the pyproject constraint: a new major is
          # exactly what we want to learn about.
          pip install --upgrade --no-cache-dir mcp
          VERSION=$(pip show mcp | awk '/^Version:/ {print $2}')
          MAJOR=${VERSION%%.*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          if [ "$MAJOR" -ge 3 ]; then
            echo "outside_range=true" >> "$GITHUB_OUTPUT"
          else
            echo "outside_range=false" >> "$GITHUB_OUTPUT"
          fi
          python - <<'PY'
          import importlib.metadata as md
          from toolregistry_server.adapters.mcp._compat import MCP_SPEC_VERSION, MCP_VERSION
          print(f"mcp {md.version('mcp')}: compat={MCP_VERSION}, spec={MCP_SPEC_VERSION}")
          PY

      - name: Run MCP adapter tests
        id: tests
        run: >
          python -m pytest
          tests/test_mcp_adapter.py
          tests/test_mcp_session.py
          tests/test_mcp_server_http.py
          -q

      - name: Open or update issue
        if: failure() || steps.sdk.outputs.outside_range == 'true'
        uses: actions/github-script@v7
        env:
          MCP_SDK_VERSION: ${{ steps.sdk.outputs.version }}
          OUTSIDE_RANGE: ${{ steps.sdk.outputs.outside_range }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const version = process.env.MCP_SDK_VERSION;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              `The MCP Python SDK release **${version}** needs attention.`,
              ``,
              process.env.OUTSIDE_RANGE === 'true'
                ? `It is outside the range declared in \`pyproject.toml\` (\`mcp>=1.17.0,<3\`). Decide whether to support it or pin it out.`
                : `The adapter test suite fails against this release.`,
              ``,
              `**Workflow run:** ${runUrl}`,
            ];
            if (process.env.TEST_OUTCOME === 'failure') {
              lines.push(``, `### Next steps`, `- Read the failing tests in the run`, `- Reproduce locally with \`pip install mcp==${version}\``);
            }
            const body = lines.join('\n');
            const title = `[CI] MCP SDK ${version} compatibility`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area:adapters',
            });
            const existing = open.find((i) => i.title.startsWith('[CI] MCP SDK'));
            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['area:adapters'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still relevant with **${version}**.\n\n${runUrl}`,
              });
            }

  spec:
    name: MCP specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Read supported spec revision
        id: local
        run: |
          VERSION=$(grep -oP 'MCP_SPEC_VERSION = "\K[^"]+' src/toolregistry_server/adapters/mcp/_compat.py)
          if [ -z "$VERSION" ]; then
            echo "::error::MCP_SPEC_VERSION not found in _compat.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "adapter targets spec $VERSION"

      - name: Fetch latest specification release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/modelcontextprotocol/modelcontextprotocol/releases/latest --jq .tag_name)
          if [ -z "$TAG" ]; then
            echo "::error::Could not read the latest spec release"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest spec release: $TAG"

      - name: Open or update issue when the spec moves
        if: steps.upstream.outputs.tag != steps.local.outputs.version
        uses: actions/github-script@v7
        env:
          LOCAL_SPEC: ${{ steps.local.outputs.version }}
          UPSTREAM_SPEC: ${{ steps.upstream.outputs.tag }}
        with:
          script: |
            const local = process.env.LOCAL_SPEC;
            const upstream = process.env.UPSTREAM_SPEC;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The MCP specification published **${upstream}**; the adapter targets **${local}**.`,
              ``,
              `**Spec releases:** https://github.com/modelcontextprotocol/modelcontextprotocol/releases`,
              `**Workflow run:** ${runUrl}`,
              ``,
              `### Checklist`,
              `- Diff the schema and changelog for the new revision`,
              `- Add any new tool/content/transport fields to the adapters`,
              `- Bump \`MCP_SPEC_VERSION\` in \`src/toolregistry_server/adapters/mcp/_compat.py\``,
              `- Re-run \`tests/test_mcp_adapter.py\` against both SDK generations`,
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'area:adapters',
            });
            const existing = open.find((i) => i.title.startsWith('[CI] MCP spec'));
            if (existing === undefined) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[CI] MCP spec ${upstream} released`,
                body,
                labels: ['area:adapters'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still ahead of the adapter (${local}).\n\n${runUrl}`,
              });
            }
