name: Notify Downstream

on:
  release:
    types: [published]

jobs:
  notify-downstream:
    # ``release: published`` fires for pre-releases too.  A dev build must not
    # ask downstream to test against it: the hub workflow opens an issue when
    # the check fails, and a pre-release is not a supported target.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - Oaklight/toolregistry-hub
    steps:
      - name: Dispatch to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: upstream-release
          client-payload: '{"version": "${{ github.event.release.tag_name }}", "package": "toolregistry-server"}'
