# Label set for this repo — part of the shared taxonomy.
# See dev-playbook/repo-setup/patterns/01-github-labels.md
#
# This file mirrors the labels that exist on GitHub (checked with
# `gh label list`).  Nothing in this repository reads it: the
# `sync-labels.sh` script lives in dev-playbook, not here.  When you add or
# change a label, create it on GitHub too (`gh label create <name> --color
# <hex> --description "<text>"`, or `gh label edit`) and keep this file in step.
# Never rename a label by deleting and recreating it — that strips the
# label from every issue. Use: gh label edit <old> --name <new>

# === Primary type labels — at most one per issue ===
- name: "bug"
  color: "CF222E"
  description: "Something isn't working"
- name: "enhancement"
  color: "1A7F37"
  description: "New feature or request"
- name: "documentation"
  color: "0969DA"
  description: "Improvements or additions to documentation"
- name: "refactor"
  color: "57606A"
  description: "Code refactoring, no behavior change"
- name: "discussion"
  color: "BF3989"
  description: "Design discussion, RFC"

# === Epic — tracking parent; never combined with enhancement ===
- name: "epic"
  color: "6F42C1"
  description: "Tracking epic: parent issue for a multi-issue workstream"

# === Qualifier labels — optional; coexist with the primary type, may stand alone ===
- name: "security"
  color: "6E0B14"
  description: "Security vulnerability"
- name: "performance"
  color: "BC4C00"
  description: "Performance optimization"
- name: "architecture"
  color: "4C2889"
  description: "Architectural improvements"
- name: "research"
  color: "0F766E"
  description: "Investigation, specification research"
- name: "pure-move"
  color: "57606A"
  description: "PR only moves code; runs the pure-move CI check"
- name: "deferred"
  color: "8c8c8c"
  description: "Deliberately not scheduled; kept open as a design record"

# === Automation labels — applied by workflows ===
# `.github/workflows/upstream-compat.yml` files issues with `upstream-compat`
# and `P1`.  Both exist on GitHub without a description.
- name: "upstream-compat"
  color: "ededed"
  description: ""
- name: "P1"
  color: "ededed"
  description: ""

# === Priority labels — at most one per issue ===
- name: "priority:critical"
  color: "7F1D1D"
  description: "Security/data-loss, fix immediately"
- name: "priority:high"
  color: "B91C1C"
  description: "Blocks other work"
- name: "priority:medium"
  color: "C2410C"
  description: "Should fix soon"
- name: "priority:low"
  color: "A16207"
  description: "Nice to have"

# === Area labels — which component ===
- name: "area:adapters"
  color: "2F6B4F"
  description: "Protocol adapters (MCP, OpenAPI)"
- name: "area:auth"
  color: "1F6B76"
  description: "Authentication, identity, token verification"
- name: "area:cli"
  color: "1D5F8A"
  description: "CLI, configuration, app bootstrap"
- name: "area:routing"
  color: "2C4A9E"
  description: "Route table, registry builder, session management"
